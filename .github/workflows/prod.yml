name: Deploy Dev

on:
  push:
    branches: ["master"]

jobs:
  deploy:
    name: Deploy to Azure
    runs-on: ubuntu-latest
    environment: prod
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CRESDENTIALS }}

      - name: Build & Push Image
        run: |
          az acr login --name ${{ secrets.ACR_NAME }}
          docker build -t ${{ secrets.ACR_LOGIN_SERVER }}/app:latest .
          docker login ${{ secrets.ACR_LOGIN_SERVER }} -u ${{ secrets.ACR_USERNAME }} -p ${{ secrets.ACR_PASSWORD }}
          docker push ${{ secrets.ACR_LOGIN_SERVER }}/app:latest

      - name: Terraform Apply
        run: |
          cd terraform
          terraform init
          terraform apply -auto-approve -var="env=dev" -var="location=westus2" -var="app_name=fastapiapp"